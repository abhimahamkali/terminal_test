<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0b09" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Post Coffee · Dusra Majla</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root{
    --bg:#0e0b09;
    --bg2:#171210;
    --ink:#f4ece2;
    --muted:#a99a88;
    --gold:#c9a25f;
    --gold-soft:#e6c98c;
    --line:rgba(201,162,95,.22);
    --card:#1b1512;
    --card2:#241b16;
    --shadow:0 30px 60px -20px rgba(0,0,0,.75);
    --r:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #2a1f18 0%, var(--bg) 55%),
      var(--bg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
    max-width:520px;margin:0 auto;
  }

  /* Header */
  header{text-align:center;flex:0 0 auto}
  .brand-eyebrow{
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin:0 0 6px;padding-left:.42em;
  }
  .brand-title{
    font-size:26px;letter-spacing:.14em;margin:0;font-weight:700;
    background:linear-gradient(180deg,#fff,var(--gold-soft));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{margin:6px 0 0;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

  /* Progress dots */
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap;flex:0 0 auto}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(201,162,95,.28);transition:.3s}
  .dot.active{background:var(--gold);width:20px;border-radius:4px}

  /* Deck */
  .deck-wrap{flex:1 1 auto;position:relative;display:flex;align-items:center;min-height:0;margin:6px 0}
  .deck{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--r)}
  .track{display:flex;height:100%;will-change:transform;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
  .track.dragging{transition:none}
  .slide{min-width:100%;height:100%;padding:0 4px;display:flex}

  .card{
    position:relative;width:100%;display:flex;flex-direction:column;
    background:linear-gradient(165deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;padding:22px 20px 18px;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 55% at 80% 0%, var(--accent,rgba(201,162,95,.16)) 0%, transparent 60%);
    opacity:.9;
  }
  .card.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
  .idx{position:absolute;top:16px;right:18px;font-size:12px;letter-spacing:.15em;color:var(--muted)}
  .emoji{font-size:40px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
  .tier{
    display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:10px;
  }
  .name{font-size:27px;letter-spacing:.06em;font-weight:700;margin:0 0 6px}
  .desc{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 16px;font-style:italic;min-height:42px}

  .profile{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
  .scale{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px}
  .scale span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .scale span.r{text-align:right}
  .bar{position:relative;height:5px;border-radius:4px;background:rgba(255,255,255,.07)}
  .bar i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:linear-gradient(180deg,#fff,var(--gold-soft));transform:translate(-50%,-50%);
    box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(201,162,95,.18);transition:left .5s cubic-bezier(.22,.61,.36,1)}

  .ingredients{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .chip{font-size:11.5px;color:var(--ink);background:rgba(201,162,95,.1);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
  .price{font-size:20px;font-weight:700;letter-spacing:.04em}
  .price small{font-size:12px;color:var(--muted);font-weight:500}
  .btn-select{
    flex:0 0 auto;border:none;cursor:pointer;
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:#241b0e;background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    padding:12px 22px;border-radius:999px;box-shadow:0 8px 20px -6px rgba(201,162,95,.6);
    transition:transform .15s,filter .2s;
  }
  .btn-select:active{transform:scale(.95)}
  .card.selected .btn-select{background:#2a2119;color:var(--gold);box-shadow:none;border:1px solid var(--gold)}

  /* side arrows */
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:rgba(20,15,12,.55);backdrop-filter:blur(6px);color:var(--gold-soft);
    font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav.prev{left:-2px}.nav.next{right:-2px}
  .nav:active{transform:translateY(-50%) scale(.9)}
  .nav[disabled]{opacity:.25;pointer-events:none}

  /* footer bar */
  .bar-bottom{flex:0 0 auto;display:flex;gap:10px;align-items:center;margin-top:12px}
  .status{
    flex:1 1 auto;min-height:46px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);display:flex;align-items:center;padding:0 14px;
    font-size:13px;color:var(--muted);transition:.3s;overflow:hidden
  }
  .status.on{border-color:var(--gold);background:rgba(201,162,95,.1);color:var(--ink)}
  .status b{color:var(--gold-soft);font-weight:700}
  .btn-reset{
    flex:0 0 auto;cursor:pointer;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:14px;padding:0 18px;height:46px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;transition:.2s
  }
  .btn-reset:active{transform:scale(.96);color:var(--ink);border-color:var(--gold)}

  .hint{text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(169,154,136,.6);margin:10px 0 0;flex:0 0 auto}

  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  .card.justpicked{animation:pop .4s ease}
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="brand-eyebrow">Post Coffee · By Pilgrim</p>
    <h1 class="brand-title">DUSRA MAJLA</h1>
    <p class="brand-sub">Beverage Programme</p>
  </header>

  <div class="dots" id="dots"></div>

  <div class="deck-wrap">
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <div class="deck" id="deck">
      <div class="track" id="track"></div>
    </div>
    <button class="nav next" id="next" aria-label="Next">›</button>
  </div>

  <div class="bar-bottom">
    <div class="status" id="status">Swipe to explore · tap Select to choose</div>
    <button class="btn-reset" id="reset">Reset</button>
  </div>
  <p class="hint" id="hint">← Slide between drinks →</p>
</div>

<script>
const DRINKS = [
  { name:"After Rain", tier:"Signature · 350", emoji:"🌧️", accent:"rgba(150,190,200,.22)",
    desc:"Delicate florals with a crisp tonic finish.",
    ing:["Elderflower","Lavender","Tonic"], price:350,
    p:{ sweet:60, curious:65, bold:25 } },
  { name:"Ruby Darling", tier:"Signature · 400", emoji:"🫐", accent:"rgba(200,70,110,.24)",
    desc:"Juicy berries balanced with citrus and sparkle.",
    ing:["Blackberry","Lemon","Soda"], price:400,
    p:{ sweet:35, curious:35, bold:45 } },
  { name:"High Tide", tier:"Signature · 350", emoji:"🌊", accent:"rgba(90,180,175,.24)",
    desc:"Clean, crisp and quietly tropical.",
    ing:["Ginger Ale","Coconut Water","Lime"], price:350,
    p:{ sweet:55, curious:40, bold:30 } },
  { name:"Peach Drift", tier:"Signature · 400", emoji:"🍑", accent:"rgba(230,150,90,.24)",
    desc:"A gentle balance of peach, tonic and subtle spice.",
    ing:["Peach","Tonic","Tabasco"], price:400,
    p:{ sweet:45, curious:60, bold:55 } },
  { name:"Wild Fire", tier:"Signature · 400", emoji:"🔥", accent:"rgba(230,110,60,.28)",
    desc:"Sweet pineapple with a gentle jalapeño finish.",
    ing:["Pineapple","Jalapeño","Soda"], price:400,
    p:{ sweet:40, curious:70, bold:70 } },
  { name:"Gin Signature", tier:"SOBER Spirit · 400", emoji:"🌴", accent:"rgba(120,190,120,.24)",
    desc:"Tropical, creamy and citrus-forward.",
    ing:["SOBER Gin","Pineapple","Coconut"], price:400,
    p:{ sweet:40, curious:55, bold:60 } },
  { name:"Rum Signature", tier:"SOBER Spirit · 400", emoji:"💙", accent:"rgba(90,120,210,.24)",
    desc:"Fresh blueberries with a sparkling finish.",
    ing:["SOBER Rum","Blueberry","Soda"], price:400,
    p:{ sweet:35, curious:45, bold:50 } },
  { name:"Whiskey Signature", tier:"SOBER Spirit · 400", emoji:"🥃", accent:"rgba(200,150,70,.26)",
    desc:"Soft vanilla, orange and oak smoke.",
    ing:["SOBER Whiskey","Orange","Smoke"], price:400,
    p:{ sweet:55, curious:60, bold:75 } },
];

const SCALES = [
  { key:"sweet",   l:"Sweet",    r:"Dry"     },
  { key:"curious", l:"Familiar", r:"Curious" },
  { key:"bold",    l:"Light",    r:"Bold"    },
];

const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const statusEl = document.getElementById('status');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const resetBtn = document.getElementById('reset');
const hintEl = document.getElementById('hint');

let index = 0;
let selected = null;

// Build slides + dots
DRINKS.forEach((d, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.innerHTML = `
    <article class="card" data-i="${i}" style="--accent:${d.accent}">
      <div class="idx">${String(i+1).padStart(2,'0')} / ${String(DRINKS.length).padStart(2,'0')}</div>
      <div class="emoji">${d.emoji}</div>
      <span class="tier">${d.tier}</span>
      <h2 class="name">${d.name}</h2>
      <p class="desc">${d.desc}</p>
      <div class="profile">
        ${SCALES.map(s => `
          <div class="scale">
            <span>${s.l}</span>
            <div class="bar"><i style="left:${d.p[s.key]}%"></i></div>
            <span class="r">${s.r}</span>
          </div>`).join('')}
      </div>
      <div class="ingredients">
        ${d.ing.map(x => `<span class="chip">${x}</span>`).join('')}
      </div>
      <div class="foot">
        <div class="price">INR ${d.price}<small> +</small></div>
        <button class="btn-select" data-i="${i}">Select</button>
      </div>
    </article>`;
  track.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i===0?' active':'');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

const cards = [...track.querySelectorAll('.card')];

function render(){
  track.style.transform = `translateX(${-index*100}%)`;
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===index));
  prevBtn.disabled = index===0;
  nextBtn.disabled = index===DRINKS.length-1;
}
function goTo(i){
  index = Math.max(0, Math.min(DRINKS.length-1, i));
  render();
}

prevBtn.addEventListener('click', ()=>goTo(index-1));
nextBtn.addEventListener('click', ()=>goTo(index+1));

// Select
track.addEventListener('click', (e)=>{
  const btn = e.target.closest('.btn-select');
  if(!btn) return;
  const i = +btn.dataset.i;
  selected = i;
  cards.forEach((c,ci)=>{
    c.classList.toggle('selected', ci===i);
    c.querySelector('.btn-select').textContent = ci===i ? '✓ Selected' : 'Select';
  });
  cards[i].classList.remove('justpicked'); void cards[i].offsetWidth;
  cards[i].classList.add('justpicked');
  const d = DRINKS[i];
  statusEl.classList.add('on');
  statusEl.innerHTML = `Order · <b>${d.name}</b> — INR ${d.price}+`;
  hintEl.textContent = "Tap Reset to start over";
  if(navigator.vibrate) navigator.vibrate(18);
});

// Reset
resetBtn.addEventListener('click', ()=>{
  selected = null;
  cards.forEach(c=>{
    c.classList.remove('selected');
    c.querySelector('.btn-select').textContent = 'Select';
  });
  statusEl.classList.remove('on');
  statusEl.textContent = 'Swipe to explore · tap Select to choose';
  hintEl.textContent = "← Slide between drinks →";
  goTo(0);
  if(navigator.vibrate) navigator.vibrate([10,40,10]);
});

// Touch / drag swipe
let startX=0, curX=0, dragging=false;
const deck = document.getElementById('deck');
function down(x){ startX=curX=x; dragging=true; track.classList.add('dragging'); }
function move(x){
  if(!dragging) return;
  curX=x;
  const dx = curX-startX;
  const pct = (dx / deck.clientWidth) * 100;
  track.style.transform = `translateX(${-index*100 + pct}%)`;
}
function up(){
  if(!dragging) return;
  dragging=false; track.classList.remove('dragging');
  const dx = curX-startX;
  const threshold = deck.clientWidth*0.18;
  if(dx < -threshold) goTo(index+1);
  else if(dx > threshold) goTo(index-1);
  else render();
}
deck.addEventListener('touchstart', e=>down(e.touches[0].clientX), {passive:true});
deck.addEventListener('touchmove',  e=>move(e.touches[0].clientX), {passive:true});
deck.addEventListener('touchend', up);
deck.addEventListener('mousedown', e=>{e.preventDefault();down(e.clientX);});
window.addEventListener('mousemove', e=>move(e.clientX));
window.addEventListener('mouseup', up);

// Keyboard
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') goTo(index+1);
  if(e.key==='ArrowLeft') goTo(index-1);
});

render();
</script>
</body>
</html>
