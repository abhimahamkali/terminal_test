<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0b09" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Post Coffee · Dusra Majla</title>
<style>
  :root{
    --bg:#0e0b09;
    --ink:#f4ece2;
    --muted:#a99a88;
    --gold:#c9a25f;
    --gold-soft:#e6c98c;
    --line:rgba(201,162,95,.22);
    --card:#1b1512;
    --card2:#241b16;
    --shadow:0 30px 60px -20px rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, #2a1f18 0%, var(--bg) 55%),var(--bg);
    overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;
  }
  .app{
    height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 18px);
    max-width:520px;margin:0 auto;
  }

  header{text-align:center;flex:0 0 auto}
  .eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 6px;padding-left:.42em}
  .title{font-size:25px;letter-spacing:.14em;margin:0;font-weight:700;
    background:linear-gradient(180deg,#fff,var(--gold-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:5px 0 0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

  /* Live display */
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0}
  .card{
    position:relative;width:100%;background:linear-gradient(165deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
    padding:24px 22px 22px;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 55% at 80% 0%, var(--accent,rgba(201,162,95,.16)) 0%, transparent 60%);
    transition:background .35s}
  .count{position:absolute;top:18px;right:20px;font-size:12px;letter-spacing:.15em;color:var(--muted);font-variant-numeric:tabular-nums}
  .emoji{font-size:46px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
  .tier{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:12px 0 10px}
  .name{font-size:30px;letter-spacing:.05em;font-weight:700;margin:0 0 6px}
  .desc{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 18px;font-style:italic;min-height:42px}

  .profile{display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
  .scale{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:8px}
  .scale span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .scale span.r{text-align:right}
  .bar{position:relative;height:5px;border-radius:4px;background:rgba(255,255,255,.07)}
  .bar i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;
    background:linear-gradient(180deg,#fff,var(--gold-soft));transform:translate(-50%,-50%);
    box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(201,162,95,.18);transition:left .35s cubic-bezier(.22,.61,.36,1)}

  .ingredients{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;color:var(--ink);background:rgba(201,162,95,.1);border:1px solid var(--line);border-radius:999px;padding:5px 11px}

  .fade{transition:opacity .18s}
  .fade.out{opacity:0}

  /* Price */
  .pricerow{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 4px;flex:0 0 auto}
  .price{font-size:34px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,var(--gold-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cur{font-size:14px;color:var(--muted);font-weight:600}
  .plus{font-size:16px;color:var(--muted)}

  /* Slider */
  .slider-wrap{flex:0 0 auto;padding:6px 4px 0}
  .ticks{display:flex;justify-content:space-between;margin-bottom:10px;padding:0 2px}
  .tick{width:2px;height:8px;border-radius:2px;background:rgba(201,162,95,.28);transition:.3s}
  .tick.active{background:var(--gold);height:12px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer;margin:0
  }
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;
    background:linear-gradient(90deg,var(--gold) var(--fill,0%),rgba(255,255,255,.08) var(--fill,0%))}
  input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.08)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--gold)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:30px;height:30px;margin-top:-11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--gold-soft) 55%,var(--gold));
    box-shadow:0 6px 16px -3px rgba(201,162,95,.7),0 0 0 5px rgba(201,162,95,.18)}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--gold-soft) 55%,var(--gold));
    box-shadow:0 6px 16px -3px rgba(201,162,95,.7),0 0 0 5px rgba(201,162,95,.18)}
  .hint{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(169,154,136,.6);margin:8px 0 0}

  .bottom{display:flex;gap:10px;align-items:center;margin-top:16px;flex:0 0 auto}
  .btn-select{flex:1 1 auto;border:none;cursor:pointer;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    color:#241b0e;background:linear-gradient(180deg,var(--gold-soft),var(--gold));padding:15px;border-radius:16px;
    box-shadow:0 10px 24px -8px rgba(201,162,95,.6);transition:transform .15s}
  .btn-select:active{transform:scale(.97)}
  .btn-select.done{background:#2a2119;color:var(--gold);box-shadow:none;border:1px solid var(--gold)}
  .btn-reset{flex:0 0 auto;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:16px;padding:0 20px;height:50px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;transition:.2s}
  .btn-reset:active{transform:scale(.96);color:var(--ink);border-color:var(--gold)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="eyebrow">Post Coffee · By Pilgrim</p>
    <h1 class="title">DUSRA MAJLA</h1>
    <p class="sub">Slide to choose your drink</p>
  </header>

  <div class="stage">
    <article class="card" id="card">
      <div class="count" id="count">01 / 08</div>
      <div class="emoji fade" id="emoji">🌧️</div>
      <span class="tier fade" id="tier">Signature</span>
      <h2 class="name fade" id="name">After Rain</h2>
      <p class="desc fade" id="desc">Delicate florals with a crisp tonic finish.</p>
      <div class="profile" id="profile"></div>
      <div class="ingredients fade" id="ing"></div>
    </article>
  </div>

  <div class="pricerow">
    <span class="cur">INR</span>
    <span class="price" id="price">350</span>
    <span class="plus">+</span>
  </div>

  <div class="slider-wrap">
    <div class="ticks" id="ticks"></div>
    <input type="range" id="slider" min="0" max="7" step="0.001" value="0" aria-label="Choose drink" />
    <p class="hint" id="hint">← Slide between 8 drinks →</p>
  </div>

  <div class="bottom">
    <button class="btn-select" id="select">Select this drink</button>
    <button class="btn-reset" id="reset">Reset</button>
  </div>
</div>

<script>
const DRINKS = [
  { name:"After Rain", tier:"Signature", emoji:"🌧️", accent:"rgba(150,190,200,.22)",
    desc:"Delicate florals with a crisp tonic finish.",
    ing:["Elderflower","Lavender","Tonic"], price:350, p:{sweet:60,curious:65,bold:25} },
  { name:"Ruby Darling", tier:"Signature", emoji:"🫐", accent:"rgba(200,70,110,.24)",
    desc:"Juicy berries balanced with citrus and sparkle.",
    ing:["Blackberry","Lemon","Soda"], price:400, p:{sweet:35,curious:35,bold:45} },
  { name:"High Tide", tier:"Signature", emoji:"🌊", accent:"rgba(90,180,175,.24)",
    desc:"Clean, crisp and quietly tropical.",
    ing:["Ginger Ale","Coconut Water","Lime"], price:350, p:{sweet:55,curious:40,bold:30} },
  { name:"Peach Drift", tier:"Signature", emoji:"🍑", accent:"rgba(230,150,90,.24)",
    desc:"A gentle balance of peach, tonic and subtle spice.",
    ing:["Peach","Tonic","Tabasco"], price:400, p:{sweet:45,curious:60,bold:55} },
  { name:"Wild Fire", tier:"Signature", emoji:"🔥", accent:"rgba(230,110,60,.28)",
    desc:"Sweet pineapple with a gentle jalapeño finish.",
    ing:["Pineapple","Jalapeño","Soda"], price:400, p:{sweet:40,curious:70,bold:70} },
  { name:"Gin Signature", tier:"SOBER Spirit", emoji:"🌴", accent:"rgba(120,190,120,.24)",
    desc:"Tropical, creamy and citrus-forward.",
    ing:["SOBER Gin","Pineapple","Coconut"], price:400, p:{sweet:40,curious:55,bold:60} },
  { name:"Rum Signature", tier:"SOBER Spirit", emoji:"💙", accent:"rgba(90,120,210,.24)",
    desc:"Fresh blueberries with a sparkling finish.",
    ing:["SOBER Rum","Blueberry","Soda"], price:400, p:{sweet:35,curious:45,bold:50} },
  { name:"Whiskey Signature", tier:"SOBER Spirit", emoji:"🥃", accent:"rgba(200,150,70,.26)",
    desc:"Soft vanilla, orange and oak smoke.",
    ing:["SOBER Whiskey","Orange","Smoke"], price:400, p:{sweet:55,curious:60,bold:75} },
];
const SCALES = [
  { key:"sweet",   l:"Sweet",    r:"Dry"     },
  { key:"curious", l:"Familiar", r:"Curious" },
  { key:"bold",    l:"Light",    r:"Bold"    },
];
const N = DRINKS.length;

const $ = id => document.getElementById(id);
const card=$('card'), slider=$('slider'), ticksEl=$('ticks'), profileEl=$('profile');
const els = { emoji:$('emoji'), tier:$('tier'), name:$('name'), desc:$('desc'),
  ing:$('ing'), price:$('price'), count:$('count') };
const selectBtn=$('select'), resetBtn=$('reset'), hintEl=$('hint');

// build ticks + profile skeleton
for(let i=0;i<N;i++){ const t=document.createElement('div'); t.className='tick'; ticksEl.appendChild(t); }
SCALES.forEach(s=>{
  const row=document.createElement('div'); row.className='scale';
  row.innerHTML=`<span>${s.l}</span><div class="bar"><i data-k="${s.key}"></i></div><span class="r">${s.r}</span>`;
  profileEl.appendChild(row);
});
const marks = [...profileEl.querySelectorAll('.bar i')];
const ticks = [...ticksEl.children];

let current = -1;
let selected = null;

function fillTrack(){
  const pct = (slider.value / (N-1)) * 100;
  slider.style.setProperty('--fill', pct + '%');
}

function paint(i){
  const d = DRINKS[i];
  const changed = i !== current;
  current = i;
  // live values that are cheap update always
  els.price.textContent = d.price;
  els.count.textContent = `${String(i+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}`;
  card.style.setProperty('--accent', d.accent);
  marks.forEach(m=> m.style.left = d.p[m.dataset.k] + '%');
  ticks.forEach((t,ti)=> t.classList.toggle('active', ti===i));
  if(!changed) return;
  // text crossfade on drink change
  const fades=[els.emoji,els.tier,els.name,els.desc,els.ing];
  fades.forEach(f=>f.classList.add('out'));
  clearTimeout(paint._t);
  paint._t=setTimeout(()=>{
    els.emoji.textContent=d.emoji;
    els.tier.textContent=d.tier;
    els.name.textContent=d.name;
    els.desc.textContent=d.desc;
    els.ing.innerHTML=d.ing.map(x=>`<span class="chip">${x}</span>`).join('');
    fades.forEach(f=>f.classList.remove('out'));
  },120);
  if(navigator.vibrate) navigator.vibrate(8);
  // if a selection was made, moving off it resets the button label
  if(selected!==null && selected!==i) markSelected(false);
}

function markSelected(on){
  selectBtn.classList.toggle('done', on);
  selectBtn.textContent = on ? '✓ Selected — '+DRINKS[current].name : 'Select this drink';
}

slider.addEventListener('input', ()=>{
  fillTrack();
  paint(Math.round(+slider.value));
});
slider.addEventListener('change', ()=>{           // snap to nearest on release
  const i = Math.round(+slider.value);
  slider.value = i; fillTrack(); paint(i);
});

selectBtn.addEventListener('click', ()=>{
  selected = current;
  markSelected(true);
  hintEl.textContent = 'Selected · slide to change or tap Reset';
  if(navigator.vibrate) navigator.vibrate(18);
});

resetBtn.addEventListener('click', ()=>{
  selected=null;
  slider.value=0; fillTrack(); paint(0);
  markSelected(false);
  hintEl.textContent='← Slide between 8 drinks →';
  if(navigator.vibrate) navigator.vibrate([10,40,10]);
});

// init
fillTrack();
current=-1; paint(0);
els.ing.innerHTML=DRINKS[0].ing.map(x=>`<span class="chip">${x}</span>`).join('');
</script>
</body>
</html>
